.phase-panel { display: none; max-width: 860px; margin: 0 auto; }
.phase-panel.active { display: block; }
.phase-title-bar {
  display: flex; align-items: center; gap: 14px;
  background: #16213e;
  border: 1px solid #c9a84c44;
  border-radius: 12px;

}
.phase-badge {

const STORAGE_KEY = 'magixx_exercises_v1';
function loadState() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
function saveState(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} }

let state = loadState();

function getTypeLabel(type) {
  if (type === 'quiz') return '<span class="ex-type type-quiz">📝 Quiz QCM</span>';
  if (type === 'pratique') return '<span class="ex-type type-pratique">🔧 Pratique</span>';
  return '<span class="ex-type type-creation">✨ Création</span>';
}

function buildStars(exId) {
  const saved = state[exId]?.stars || 0;
  return `<div class="stars-section">
    <div class="stars-label">Évaluation personnelle</div>
    <div class="stars" data-exid="${exId}">
      ${[1,2,3,4,5].map(n => `<span class="star ${saved >= n ? 'lit' : ''}" data-star="${n}">★</span>`).join('')}
    </div>
  </div>`;
}

function buildQuiz(ex) {
  const s = state[ex.id] || {};
  return `<div class="ex-card" id="card-${ex.id}">
    <div class="ex-header">${getTypeLabel(ex.type)}<span class="ex-title">${ex.title}</span></div>
    <p style="font-size:14px;color:#ccc;margin-bottom:14px;line-height:1.6">${ex.question}</p>
    <div class="qcm-options" id="opts-${ex.id}">
      ${ex.options.map((opt, i) => {
        let cls = '';
        if (s.answered) { if (i === ex.correct) cls = 'correct'; else if (i === s.selected) cls = 'wrong'; }
        else if (i === s.selected) cls = 'selected';
        return `<div class="qcm-option ${cls}" data-exid="${ex.id}" data-opt="${i}" data-correct="${ex.correct}">
          <div class="qcm-letter">${String.fromCharCode(65+i)}</div>
          <div class="qcm-text">${opt}</div>
        </div>`;
      }).join('')}
    </div>
    ${!s.answered ? `<button class="qcm-check-btn" data-exid="${ex.id}">Valider ma réponse</button>` : ''}
    <div class="qcm-feedback ${s.answered ? (s.selected === ex.correct ? 'correct-fb' : 'wrong-fb') : ''}" id="fb-${ex.id}">
      ${s.answered ? (s.selected === ex.correct ? '✅ Correct ! ' : '❌ Incorrect. ') + ex.explanation : ''}
    </div>
    ${buildStars(ex.id)}
  </div>`;
}

function buildPratique(ex) {
  const s = state[ex.id] || {};
  return `<div class="ex-card" id="card-${ex.id}">
    <div class="ex-header">${getTypeLabel(ex.type)}<span class="ex-title">${ex.title}</span></div>
    <div class="ex-description">${ex.description}</div>
    <div class="notes-label">Mes notes & résultats</div>
    <textarea class="notes-area" id="notes-${ex.id}" placeholder="${ex.placeholder}" rows="5">${s.notes || ''}</textarea>
    ${buildStars(ex.id)}
    <div style="margin-top:12px">
      <button class="save-btn" data-exid="${ex.id}" data-type="notes">Sauvegarder</button>
      <span class="save-confirm" id="sc-${ex.id}">✓ Sauvegardé</span>
    </div>
  </div>`;
}

function buildAll() {
  const nav = document.getElementById('navTabs');
  const panels = document.getElementById('panels');
  PHASES_DATA.forEach((phase, idx) => {
    // Tab
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.dataset.phase = phase.num;
    btn.innerHTML = `<span class="tab-phase">Phase ${phase.num}</span>${phase.title.substring(0, 12)}${phase.title.length > 12 ? '…' : ''}`;
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.phase-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`panel-${phase.num}`).classList.add('active');
    });
    nav.appendChild(btn);

    // Panel
    const panel = document.createElement('div');
    panel.className = 'phase-panel' + (idx === 0 ? ' active' : '');
    panel.id = `panel-${phase.num}`;
    panel.innerHTML = `
      <div class="phase-title-bar">
        <div class="phase-badge">PHASE ${phase.num}</div>
        <div><h2>${phase.title}</h2><div class="weeks">${phase.weeks}</div></div>
      </div>
      ${phase.exercises.map(ex => ex.type === 'quiz' ? buildQuiz(ex) : buildPratique(ex)).join('')}
    `;
    panels.appendChild(panel);
  });

  // Quiz events
  document.querySelectorAll('.qcm-option').forEach(opt => {
    opt.addEventListener('click', function() {
      if (state[this.dataset.exid]?.answered) return;
      if (!state[this.dataset.exid]) state[this.dataset.exid] = {};
      state[this.dataset.exid].selected = parseInt(this.dataset.opt);
      document.querySelectorAll(`[data-exid="${this.dataset.exid}"].qcm-option`).forEach(o => o.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  document.querySelectorAll('.qcm-check-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const exId = this.dataset.exid;
      const s = state[exId];
      if (s?.selected === undefined) return;
      const phase = PHASES_DATA.find(p => p.exercises.find(e => e.id === exId));
      const ex = phase?.exercises.find(e => e.id === exId);
      if (!ex) return;
      s.answered = true;
      saveState(state);
      // Re-style options
      document.querySelectorAll(`[data-exid="${exId}"].qcm-option`).forEach((o, i) => {
        o.classList.remove('selected');
        if (i === ex.correct) o.classList.add('correct');
        else if (i === s.selected) o.classList.add('wrong');
      });
      const fb = document.getElementById(`fb-${exId}`);
      fb.className = `qcm-feedback ${s.selected === ex.correct ? 'correct-fb' : 'wrong-fb'}`;
      fb.textContent = (s.selected === ex.correct ? '✅ Correct ! ' : '❌ Incorrect. ') + ex.explanation;
      this.remove();
      if (!s.stars) { state[exId].stars = s.selected === ex.correct ? 5 : 2; saveState(state); }
      updateDashboard();
    });
  });

  // Notes save
  document.querySelectorAll('.save-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const exId = this.dataset.exid;
      if (!state[exId]) state[exId] = {};
      state[exId].notes = document.getElementById(`notes-${exId}`).value;
      state[exId].saved = true;
      saveState(state);
      const sc = document.getElementById(`sc-${exId}`);
      sc.classList.add('show');
      setTimeout(() => sc.classList.remove('show'), 2000);
      updateDashboard();
    });
  });

  // Stars
  document.querySelectorAll('.stars').forEach(starsEl => {
    starsEl.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', function() {
        const exId = starsEl.dataset.exid;
        const val = parseInt(this.dataset.star);
        if (!state[exId]) state[exId] = {};
        state[exId].stars = val;
        saveState(state);
        starsEl.querySelectorAll('.star').forEach(s => s.classList.toggle('lit', parseInt(s.dataset.star) <= val));
        updateDashboard();
      });
    });
  });

  updateDashboard();
}

function updateDashboard() {
  let total = 0, completed = 0, correct = 0, totalStars = 0, starCount = 0;
  PHASES_DATA.forEach(phase => {
    phase.exercises.forEach(ex => {
      total++;
      const s = state[ex.id];
      if (s) {
        if (ex.type === 'quiz' && s.answered) { completed++; if (s.selected === ex.correct) correct++; }
        else if (ex.type !== 'quiz' && s.saved) completed++;
        if (s.stars) { totalStars += s.stars; starCount++; }
      }
    });
  });
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-stars').textContent = totalStars;
  document.getElementById('stat-avg').textContent = starCount ? (totalStars / starCount).toFixed(1) + '★' : '0★';
  const pct = total ? Math.round(completed / total * 100) : 0;
  document.getElementById('globalBar').style.width = pct + '%';
  document.getElementById('globalPct').textContent = pct + '% complété';
  document.getElementById('congratsDash').classList.toggle('visible', completed === total && total > 0);
}

buildAll();
</script>
</body>
