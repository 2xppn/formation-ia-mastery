<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Formation IA — MAGIXX PRO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #1a1a2e;
    color: #e8e0d0;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .logo-bar {
    text-align: center;
    padding: 18px 0 10px;
    letter-spacing: 4px;
    font-size: 13px;
    color: #c9a84c;
    font-weight: 700;
    text-transform: uppercase;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    color: #fff;
    margin: 6px 0 2px;
    letter-spacing: 1px;
  }
  .subtitle {
    text-align: center;
    color: #c9a84c;
    font-size: 14px;
    margin-bottom: 28px;
    letter-spacing: 2px;
  }

  /* PROGRESS GLOBAL */
  .progress-card {
    background: #16213e;
    border: 1px solid #c9a84c44;
    border-radius: 14px;
    padding: 22px 28px;
    max-width: 820px;
    margin: 0 auto 32px;
    text-align: center;
  }
  .progress-label {
    font-size: 13px;
    color: #c9a84c;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .progress-bar-wrap {
    background: #0f3460;
    border-radius: 50px;
    height: 22px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a84c, #f0d080);
    border-radius: 50px;
    transition: width 0.5s ease;
    min-width: 0;
  }
  .progress-pct {
    font-size: 32px;
    font-weight: 700;
    color: #c9a84c;
  }
  .progress-count {
    font-size: 13px;
    color: #888;
    margin-top: 2px;
  }

  /* FÉLICITATIONS */
  .congrats {
    display: none;
    background: linear-gradient(135deg, #c9a84c22, #f0d08022);
    border: 2px solid #c9a84c;
    border-radius: 14px;
    padding: 24px;
    text-align: center;
    max-width: 820px;
    margin: 0 auto 24px;
    animation: pulse 1.5s ease-in-out infinite alternate;
  }
  .congrats.visible { display: block; }
  .congrats h2 { color: #c9a84c; font-size: 26px; margin-bottom: 8px; }
  .congrats p { color: #e8e0d0; font-size: 15px; }
  @keyframes pulse { from { box-shadow: 0 0 10px #c9a84c44; } to { box-shadow: 0 0 30px #c9a84c88; } }

  /* PHASES */
  .phases-container {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .phase-card {
    background: #16213e;
    border: 1px solid #c9a84c33;
    border-radius: 14px;
    overflow: hidden;
  }
  .phase-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .phase-header:hover { background: #1e2d50; }
  .phase-left { display: flex; align-items: center; gap: 14px; }
  .phase-badge {
    background: #c9a84c;
    color: #1a1a2e;
    font-weight: 700;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .phase-title { font-size: 16px; font-weight: 600; color: #fff; }
  .phase-weeks { font-size: 12px; color: #888; margin-top: 2px; }
  .phase-right { display: flex; align-items: center; gap: 14px; }
  .phase-counter {
    font-size: 13px;
    color: #c9a84c;
    font-weight: 600;
    white-space: nowrap;
  }
  .phase-mini-bar {
    width: 80px;
    height: 6px;
    background: #0f3460;
    border-radius: 10px;
    overflow: hidden;
  }
  .phase-mini-fill {
    height: 100%;
    background: #c9a84c;
    border-radius: 10px;
    transition: width 0.4s;
  }
  .chevron {
    color: #c9a84c;
    font-size: 18px;
    transition: transform 0.3s;
  }
  .phase-card.open .chevron { transform: rotate(180deg); }
  .phase-body {
    display: none;
    padding: 0 20px 16px;
    border-top: 1px solid #c9a84c22;
  }
  .phase-card.open .phase-body { display: block; }

  /* ITEMS */
  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #c9a84c11;
    cursor: pointer;
    transition: background 0.15s;
    border-radius: 6px;
    padding-left: 6px;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #1e2d5033; }
  .checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid #c9a84c88;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-top: 1px;
  }
  .item.done .checkbox {
    background: #c9a84c;
    border-color: #c9a84c;
  }
  .item.done .checkbox::after {
    content: '✓';
    color: #1a1a2e;
    font-weight: 700;
    font-size: 13px;
  }
  .item-text {
    font-size: 14px;
    color: #ccc;
    line-height: 1.5;
    transition: all 0.2s;
  }
  .item.done .item-text {
    text-decoration: line-through;
    color: #666;
  }
</style>
</head>
<body>

<div class="logo-bar">✦ MAGIXX PRO ✦</div>
<h1>Checklist Formation IA</h1>
<div class="subtitle">Débutant → Master &nbsp;·&nbsp; 20 semaines &nbsp;·&nbsp; 7 phases</div>

<!-- PROGRESS GLOBAL -->
<div class="progress-card">
  <div class="progress-label">Progression Globale</div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="globalBar" style="width:0%"></div></div>
  <div class="progress-pct" id="globalPct">0%</div>
  <div class="progress-count" id="globalCount">0 / 0 tâches complétées</div>
</div>

<div class="congrats" id="congrats">
  <h2>🎓 Félicitations !</h2>
  <p>Vous avez complété l'intégralité de la formation IA Mastery.<br>Vous êtes maintenant au niveau <strong>Master</strong> ! Bravo pour votre investissement.</p>
</div>

<div class="phases-container" id="phases"></div>

<script>
const PHASES = [
  {
    num: 1, weeks: "Semaines 1 – 2", title: "Comprendre l'IA",
    items: [
      "Découvrir ce qu'est l'intelligence artificielle et ses applications",
      "Comparer les assistants IA : ChatGPT, Claude, Gemini",
      "Apprendre la formule CRITE (Contexte, Rôle, Instruction, Ton, Exemple)",
      "Comprendre les types de modèles : LLM, diffusion, multimodal",
      "Identifier des cas d'usage IA dans mon domaine professionnel",
      "Pratiquer 5 prompts quotidiens avec la grille d'évaluation",
      "Réaliser l'atelier comparatif de 3 modèles IA sur le même prompt",
      "Valider la Phase 1 avec le quizz de fin de module",
      "Documenter mes apprentissages dans mon journal de bord",
    ]
  },
  {
    num: 2, weeks: "Semaines 3 – 5", title: "Outils IA au quotidien",
    items: [
      "Configurer Cowork et explorer les plugins disponibles",
      "Maîtriser les connecteurs MCP dans l'environnement Cowork",
      "Créer une présentation PPTX complète avec le skill Cowork",
      "Générer un document Word professionnel avec le skill DOCX",
      "Construire un tableur Excel avec formules via le skill XLSX",
      "Créer et manipuler un fichier PDF avec le skill PDF",
      "Mettre en place une première automatisation de tâche répétitive",
      "Réaliser l'atelier : rapport complet automatisé avec Claude",
      "Valider la Phase 2 avec le projet pratique de productivité",
    ]
  },
  {
    num: 3, weeks: "Semaines 6 – 8", title: "GitHub & Collaboration",
    items: [
      "Maîtriser le vocabulaire GitHub : repo, commit, branch, merge, PR",
      "Installer GitHub Desktop et créer son premier repository",
      "Réaliser le workflow complet : add, commit, push, pull",
      "Créer une branche de développement et faire un merge",
      "Publier un site web gratuitement avec GitHub Pages",
      "Ouvrir et traiter une pull request en équipe",
      "Utiliser les Issues et Project Boards pour gérer un projet",
      "Réaliser l'atelier : portfolio GitHub avec GitHub Pages",
      "Valider la Phase 3 en contribuant à un repo collaboratif",
    ]
  },
  {
    num: 4, weeks: "Semaines 9 – 12", title: "Créer des Applications",
    items: [
      "Explorer les outils no-code : Bubble, Glide, Webflow",
      "Créer une application web basique avec Bubble",
      "Coder une page HTML/CSS complète avec l'aide de Claude",
      "Intégrer du JavaScript interactif dans une page web",
      "Déployer une application sur Vercel ou Netlify",
      "Comprendre le concept de PWA (Progressive Web App)",
      "Consommer une API REST depuis une page web",
      "Réaliser l'atelier : landing page complète déployée en ligne",
      "Valider la Phase 4 avec une application web fonctionnelle",
    ]
  },
  {
    num: 5, weeks: "Semaines 13 – 15", title: "Agents IA & Automatisations",
    items: [
      "Comprendre l'architecture des agents IA et du protocole MCP",
      "Configurer et utiliser Claude Code en ligne de commande",
      "Créer une automatisation planifiée dans Cowork",
      "Construire un workflow visuel avec Make (ex-Integromat)",
      "Connecter des applications avec Zapier",
      "Créer un Skill personnalisé dans l'environnement Cowork",
      "Mettre en place une chaîne d'agents pour une tâche complexe",
      "Réaliser l'atelier : pipeline d'automatisation complet",
      "Valider la Phase 5 en déployant un agent IA opérationnel",
    ]
  },
  {
    num: 6, weeks: "Semaines 16 – 18", title: "IA Appliquée aux Métiers",
    items: [
      "Appliquer l'IA au management : reporting et prise de décision",
      "Utiliser l'IA pour optimiser la gestion du temps et des priorités",
      "Analyser des données financières avec l'IA",
      "Générer du contenu marketing avec l'IA (textes, visuels)",
      "Créer des présentations et supports visuels avec l'IA",
      "Analyser des contrats et documents juridiques avec l'IA",
      "Réaliser l'atelier sectoriel adapté à son domaine",
      "Constituer le dossier de transformation IA dans son secteur",
      "Valider la Phase 6 avec le projet d'application métier",
    ]
  },
  {
    num: 7, weeks: "Semaines 19 – 20", title: "Niveau Master & Capstone",
    items: [
      "Concevoir l'architecture d'un système IA complet",
      "Intégrer l'API Claude (Anthropic) dans une application",
      "Maîtriser les enjeux éthiques de l'IA : biais et gouvernance",
      "Mettre en place une veille technologique IA",
      "Définir l'idée et le périmètre du projet Capstone",
      "Développer le MVP du produit IA avec toutes les compétences acquises",
      "Déployer le projet Capstone en production",
      "Pitcher le projet devant un jury (ou préparer la présentation)",
      "Obtenir la Certification de Maîtrise IA MAGIXX PRO",
    ]
  }
];

const STORAGE_KEY = 'magixx_checklist_v1';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

let state = loadState();

function getItemId(phaseNum, itemIdx) {
  return `p${phaseNum}_i${itemIdx}`;
}

function updatePhaseCounter(phaseNum) {
  const phase = PHASES[phaseNum - 1];
  const total = phase.items.length;
  const done = phase.items.filter((_, i) => state[getItemId(phaseNum, i)]).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const card = document.getElementById(`phase-card-${phaseNum}`);
  if (!card) return;
  card.querySelector('.phase-counter').textContent = `${done}/${total} tâches`;
  card.querySelector('.phase-mini-fill').style.width = pct + '%';
}

function updateGlobal() {
  let total = 0, done = 0;
  PHASES.forEach(p => {
    p.items.forEach((_, i) => {
      total++;
      if (state[getItemId(p.num, i)]) done++;
    });
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('globalBar').style.width = pct + '%';
  document.getElementById('globalPct').textContent = pct + '%';
  document.getElementById('globalCount').textContent = `${done} / ${total} tâches complétées`;
  document.getElementById('congrats').classList.toggle('visible', done === total && total > 0);
}

function toggleItem(phaseNum, itemIdx) {
  const id = getItemId(phaseNum, itemIdx);
  state[id] = !state[id];
  saveState(state);
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.classList.toggle('done', state[id]);
  updatePhaseCounter(phaseNum);
  updateGlobal();
}

function buildPhases() {
  const container = document.getElementById('phases');
  PHASES.forEach(phase => {
    const card = document.createElement('div');
    card.className = 'phase-card';
    card.id = `phase-card-${phase.num}`;
    const donePre = phase.items.filter((_, i) => state[getItemId(phase.num, i)]).length;
    const pctPre = Math.round(donePre / phase.items.length * 100);
    card.innerHTML = `
      <div class="phase-header">
        <div class="phase-left">
          <div class="phase-badge">PHASE ${phase.num}</div>
          <div>
            <div class="phase-title">${phase.title}</div>
            <div class="phase-weeks">${phase.weeks}</div>
          </div>
        </div>
        <div class="phase-right">
          <div class="phase-mini-bar"><div class="phase-mini-fill" style="width:${pctPre}%"></div></div>
          <div class="phase-counter">${donePre}/${phase.items.length} tâches</div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="phase-body">
        ${phase.items.map((item, i) => {
          const id = getItemId(phase.num, i);
          const done = state[id] ? 'done' : '';
          return `<div class="item ${done}" data-id="${id}" data-phase="${phase.num}" data-idx="${i}">
            <div class="checkbox"></div>
            <div class="item-text">${item}</div>
          </div>`;
        }).join('')}
      </div>`;
    card.querySelector('.phase-header').addEventListener('click', () => card.classList.toggle('open'));
    card.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => toggleItem(parseInt(el.dataset.phase), parseInt(el.dataset.idx)));
    });
    container.appendChild(card);
  });
  updateGlobal();
}

buildPhases();
</script>
</body>
</html>
